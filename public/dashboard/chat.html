<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#010611" />
    <title>JARVIS OS — Chat Panel</title>
    <link rel="stylesheet" href="./styles.css?v=16" />
    <link rel="stylesheet" href="./live.css?v=29" />
  </head>
  <body>
    <div class="jarvis-shell chat-only" id="jarvisApp" data-state="idle">
      <section class="chat-panel panel-asset" id="chatConsole" aria-label="Чат с Джарвисом">
        <img src="./assets/skins/chat.png?v=16" alt="Чат JARVIS" draggable="false" />
        <div class="mode-hotspots hotspots" aria-label="Режим запроса">
          <button data-mode="auto" aria-label="Авто"></button>
          <button data-mode="image" aria-label="Изображение"></button>
          <button data-mode="video" aria-label="Видео"></button>
          <button data-mode="music" aria-label="Музыка"></button>
          <button data-mode="transcription" aria-label="Транскрипция"></button>
          <button data-mode="analysis" aria-label="Анализ"></button>
        </div>
        <form class="command-form" id="commandForm">
          <input id="commandInput" autocomplete="off" placeholder="Скажи ДЖАРВИСУ что сделать..." aria-label="Команда для Джарвиса" />
          <button class="mic-zone" id="micButton" type="button" aria-label="Голосовой ввод"></button>
          <button class="send-zone" type="submit" aria-label="Отправить"></button>
        </form>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite">СИСТЕМА ГОТОВА</div>
    </div>

    <script src="./app.js?v=16"></script>
    <script src="./live.js?v=29"></script>
  </body>
</html>
